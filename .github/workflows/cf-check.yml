name: CF token check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: conta e permissoes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "ACCOUNT_ID=$CF_ACCT"
          echo "--- verify ---"
          curl -s -H "Authorization: Bearer $CF_TOKEN" https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/tokens/verify | head -c 300; echo
          echo "--- workers scripts (write?) ---"
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/workers/scripts" -o w.json -w "HTTP %{http_code}\n"
          node -e "const d=require('./w.json');console.log('success:',d.success);console.log('erros:',JSON.stringify(d.errors||[]).slice(0,200));console.log('scripts:',(d.result||[]).map(x=>x.id).join(', ').slice(0,500))"
          echo "--- pages projects ---"
          curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/pages/projects" -o p.json -w "HTTP %{http_code}\n"
          node -e "const d=require('./p.json');console.log('success:',d.success,'| projetos:',(d.result||[]).map(x=>x.name).join(', '))"
